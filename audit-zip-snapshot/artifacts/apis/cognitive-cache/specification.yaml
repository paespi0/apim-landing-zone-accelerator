              example:
                detail:
                  - loc:
                      - { }
                    msg: string
                    type: string
    post:
      tags:
        - Personal
      summary: Personal Create Document
      description: "Upload a new personal document to the document store. \nThe document will be split into chunks and each chunk will be embedded and indexed for search.\n\nReturns the newly created document header."
      operationId: CreatePersonalDocument
      parameters:
        - name: document_id
          in: query
          description: "The unique ID of the ocument to be uploaded, for documents from external systems use a system \n            generated unique id so documents so documents can be updated without having to track the DVN document id."
          required: true
          schema:
            title: Document Id
            maxLength: 256
            minLength: 1
            type: string
            description: "The unique ID of the ocument to be uploaded, for documents from external systems use a system \n            generated unique id so documents so documents can be updated without having to track the DVN document id."
        - name: title
          in: query
          description: The document title
          required: true
          schema:
            title: Title
            maxLength: 256
            minLength: 1
            type: string
            description: The document title
        - name: category
          in: query
