          required: true
          schema:
            title: Category
            maxLength: 256
            minLength: 1
            type: string
            description: The document category
        - name: source_url
          in: query
          description: The document source url. This will be provided to models to link back to the document source.
          required: true
          schema:
            title: Source Url
            maxLength: 2048
            minLength: 1
            type: string
            description: The document source url. This will be provided to models to link back to the document source.
        - name: owner
          in: query
          description: The document owner
          required: true
          schema:
            title: Owner
            maxLength: 256
            minLength: 1
            type: string
            description: The document owner
      requestBody:
        content:
          multipart/form-data: { }
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DVNDocument'
              example:
                document_id: string
                title: string
                category: string
                url: string
                owner: string
                created: string
                last_modified: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
              example:
                detail:
                  - loc:
                      - { }
                    msg: string
                    type: string
