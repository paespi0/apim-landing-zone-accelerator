openapi: 3.0.1
info:
  title: Cognitive Cache API
  version: '1.0'
servers:
  - url: https://apim.pre.dvn.com/cognitive_cache
  - url: https://api.pre.dvn.com/cognitive_cache
  - url: https://ext.api.pre.dvn.com/cognitive_cache
paths:
  /search:
    get:
      tags:
        - Documents
      summary: Document Search
      description: Search the document store for documents that match the search text. The search can be filtered by category and the number of results can be limited.
      operationId: DocumentSearch
      parameters:
        - name: search
          in: query
          description: The search query
          required: true
          schema:
            title: Search
            minLength: 1
            type: string
            description: The search query
        - name: category
          in: query
          description: The category filter
          schema:
            title: Category
            minLength: 1
            type: string
            description: The category filter
        - name: top
          in: query
          description: The number of search results to retrieve
          schema:
            title: Top
            type: integer
            description: The number of search results to retrieve
            default: 3
        - name: hybrid_search
          in: query
          description: Flag to use hybrid search. A value of false will perform a pure vector search.
          schema:
            title: Hybrid Search
            type: boolean
            description: Flag to use hybrid search. A value of false will perform a pure vector search.
            default: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Document Search Response
                type: array
                items:
                  $ref: '#/components/schemas/DVNDocumentSearchResult'
              example:
                - document_chunk:
                    chunk_id: string
                    document_id: string
                    chunk_index: 0
                    title: string
                    content: string
                    category: string
                    url: string
                    owner: string
                    created: string
                    last_modified: string
                  score: 0
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
              example:
                detail:
                  - loc:
                      - { }
                    msg: string
                    type: string
  '/documents/{document_id}':
    get:
      tags:
        - Documents
      summary: Get Document Chunks
      description: Retrieves chunks of a document based on the document id provided in the path.
      operationId: GetDocumentChunks
      parameters:
        - name: document_id
          in: path
          description: The document id to retrieve
          required: true
          schema:
            title: Document Id
            maxLength: 256
            minLength: 1
            type: string
            description: The document id to retrieve
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Get Document Chunks Documents  Document Id  Get
                type: array
                items:
                  $ref: '#/components/schemas/DVNDocumentChunk'
              example:
                - chunk_id: string
                  document_id: string
                  chunk_index: 0
                  title: string
                  content: string
                  category: string
                  url: string
                  owner: string
                  created: string
                  last_modified: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
              example:
                detail:
                  - loc:
                      - { }
                    msg: string
                    type: string
    delete:
      tags:
        - Documents
      summary: Delete Document
      description: Delete a document based on the document id provided in the path.
      operationId: DeleteDocument
      parameters:
        - name: document_id
          in: path
          description: The document id to retrieve
          required: true
          schema:
            title: Document Id
            maxLength: 256
            minLength: 1
            type: string
            description: The document id to retrieve
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
              example:
                detail:
                  - loc:
                      - { }
                    msg: string
                    type: string
  '/documents/{document_id}/search':
    get:
      tags:
        - Documents
      summary: Document Search By Id
      description: Search a specific document by id for text
      operationId: DocumentSearchById
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: string
        - name: search
          in: query
          required: true
          schema:
            type: string
        - name: category
          in: query
          description: The category filter
          schema:
            title: Category
            minLength: 1
            type: string
            description: The category filter
        - name: top
          in: query
          description: The number of search results to retrieve
          schema:
            title: Top
            type: integer
            description: The number of search results to retrieve
            default: 3
        - name: hybrid_search
          in: query
          description: Flag to use hybrid search. A value of false will perform a pure vector search.
          schema:
            title: Hybrid Search
            type: boolean
            description: Flag to use hybrid search. A value of false will perform a pure vector search.
            default: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Document Search Response
                type: array
                items:
                  $ref: '#/components/schemas/DVNDocumentSearchResult'
              example:
                - document_chunk:
