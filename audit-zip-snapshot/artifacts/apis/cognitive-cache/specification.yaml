components:
  schemas:
    DVNDocument:
      title: DVNDocument
      required:
        - document_id
        - title
        - category
        - url
        - owner
        - created
        - last_modified
      type: object
      properties:
        document_id:
          title: Document Id
          type: string
        title:
          title: Title
          type: string
        category:
          title: Category
          type: string
        url:
          title: Url
          type: string
        owner:
          title: Owner
          type: string
        created:
          title: Created
          type: string
          format: date-time
        last_modified:
          title: Last Modified
          type: string
          format: date-time
    DVNDocumentChunk:
      title: DVNDocumentChunk
      required:
        - chunk_id
        - document_id
        - chunk_index
        - title
        - content
        - category
        - url
        - owner
        - created
        - last_modified
      type: object
      properties:
        chunk_id:
          title: Chunk Id
          type: string
        document_id:
          title: Document Id
          type: string
        chunk_index:
          title: Chunk Index
          type: integer
        title:
          title: Title
          type: string
        content:
          title: Content
          type: string
        category:
          title: Category
          type: string
        url:
          title: Url
          type: string
        owner:
          title: Owner
          type: string
        created:
          title: Created
          type: string
          format: date-time
        last_modified:
          title: Last Modified
          type: string
          format: date-time
    DVNDocumentSearchResult:
      title: DVNDocumentSearchResult
      required:
        - document_chunk
        - score
      type: object
      properties:
        document_chunk:
          $ref: '#/components/schemas/DVNDocumentChunk'
        score:
          title: Score
          type: number
    HTTPValidationError:
      title: HTTPValidationError
      type: object
      properties:
        detail:
          title: Detail
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
    TiktokenRequest:
      title: TiktokenRequest
      required:
        - text
      type: object
      properties:
        text:
          title: Text
          type: string
        encoding:
          title: Encoding
          type: string
          default: cl100k_base
    TiktokenResponse:
      title: TiktokenResponse
      required:
        - token_count
        - tokens
      type: object
      properties:
        token_count:
          title: Token Count
          type: integer
        tokens:
          title: Tokens
          type: array
          items:
            type: integer
    ValidationError:
      title: ValidationError
      required:
        - loc
        - msg
        - type
      type: object
      properties:
        loc:
          title: Location
          type: array
          items:
            anyOf:
              - type: string
              - type: integer
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
  securitySchemes:
    apiKeyHeader:
      type: apiKey
      name: Ocp-Apim-Subscription-Key
      in: header
    apiKeyQuery:
      type: apiKey
      name: subscription-key
      in: query
security:
  - apiKeyHeader: [ ]
  - apiKeyQuery: [ ]