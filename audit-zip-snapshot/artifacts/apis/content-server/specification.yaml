                  - data:
                      - self:
                          - body: string
                            content_type: string
                            href: string
                            method: string
                            name: string
                results:
                  - data:
                      - facets:
                          - display_count: true
                            id: 0
                            name: string
                            total_displayable: 0
                        values:
                          - available:
                              - count: 0
                                name: string
                                percentage: 0
                                value: string
                            selected:
                              - count: 0
                                name: string
                                percentage: 0
                                value: string
        '400':
          description: '<ul><li>The REST API URL could not be found in the mappings registry</li><li>The ''top_values_limit'' parameter contains invalid value(s) ''{<non-available facet ID>}''</li></ul>'
        '401':
          description: Authentication Required
        '500':
