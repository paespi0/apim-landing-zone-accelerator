                    - exchange_mailbox
                    - notes_mailbox
                    - outlook_pst
                    - file_stream
                    - mailbox_other
                  type: string
                external_identity:
                  type: string
                external_identity_type:
                  enum:
                    - email_address
                    - domain_userid
                    - generic_userid
                    - name
                    - last_name
                    - windows_sid
                    - guid
                    - phone_number
                    - ldap_name
                    - exchange_mailboxid
                  type: string
                original_id:
                  type: integer
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/nodes_CreateResponse'
              example:
                id: 0
        '400':
