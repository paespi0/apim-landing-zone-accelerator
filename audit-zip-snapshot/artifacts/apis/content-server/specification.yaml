                  type: string
                external_create_date:
                  type: string
                external_modify_date:
                  type: string
                external_source:
                  enum:
                    - file_system
                    - mobile_device
                    - scanner
                    - fax
                    - ftp
                    - shared_drive
                    - removable_disk
                    - backup_media
                    - optical_disk
                    - onedrive
                    - cloud_storage
                    - camera
